<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="date" id="today-date"></p>
        <h1>My To-Do List</h1>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="progress-text" id="progress-text"></p>
      </header>

      <form id="task-form">
        <div class="form-row">
          <input
            type="text"
            id="task-input"
            placeholder="What do you need to do?"
            aria-label="New task"
            required
          />
          <button type="submit">Add</button>
        </div>
        <div class="form-row options">
          <label
            >Deadline
            <input type="date" id="due-input" />
          </label>
          <label
            >Priority
            <select id="priority-input">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label
            >Category
            <input
              type="text"
              id="category-input"
              list="category-list"
              placeholder="e.g. Work"
            />
          </label>
          <datalist id="category-list"></datalist>
        </div>
      </form>

      <section id="filters" aria-label="Filter tasks">
        <div class="chips" id="status-filter" role="group" aria-label="Status">
          <button
            type="button"
            class="chip"
            data-status="all"
            aria-pressed="true"
          >
            All
          </button>
          <button
            type="button"
            class="chip"
            data-status="active"
            aria-pressed="false"
          >
            Active
          </button>
          <button
            type="button"
            class="chip"
            data-status="done"
            aria-pressed="false"
          >
            Completed
          </button>
        </div>
        <div class="filter-row">
          <select id="filter-priority" aria-label="Filter by priority">
            <option value="">Any priority</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <select id="filter-category" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
          <select id="filter-due" aria-label="Filter by deadline">
            <option value="">Any deadline</option>
            <option value="overdue">Overdue</option>
            <option value="today">Due today</option>
            <option value="week">Next 7 days</option>
            <option value="none">No deadline</option>
          </select>
          <select id="sort-by" aria-label="Sort tasks">
            <option value="due">Sort: deadline</option>
            <option value="priority">Sort: priority</option>
            <option value="newest">Sort: newest</option>
          </select>
        </div>
      </section>

      <ul id="task-list"></ul>

      <div id="empty-message" hidden>
        <span class="empty-icon" aria-hidden="true">&#10003;</span>
        <p>No tasks yet. Add one above!</p>
      </div>

      <div id="footer-bar">
        <span id="task-count"></span>
        <button type="button" id="clear-done">Clear completed</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
