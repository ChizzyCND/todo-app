<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="date" id="today-date"></p>
        <h1>My To-Do List</h1>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="progress-text" id="progress-text"></p>
      </header>

      <form id="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="What do you need to do?"
          aria-label="New task"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="task-list"></ul>

      <div id="empty-message" hidden>
        <span class="empty-icon" aria-hidden="true">&#10003;</span>
        <p>No tasks yet. Add one above!</p>
      </div>

      <div id="footer-bar">
        <span id="task-count"></span>
        <button type="button" id="clear-done">Clear completed</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
